<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المخفية | مس عفاف</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #03070d;
            --panel-bg: #0d1724;
            --card-bg: #132238;
            --gold-accent: #e5be6f;
            --text-white: #ffffff;
            --text-sub: #94a3b8;
            --border-line: rgba(229, 190, 111, 0.2);
            --danger-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            min-height: 100vh;
            padding: 20px;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 13, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-line);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .login-box i {
            font-size: 2.5rem;
            color: var(--gold-accent);
            margin-bottom: 15px;
        }

        .login-box h3 {
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: var(--bg-dark);
            border: 1px solid var(--border-line);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--gold-accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            font-size: 1rem;
        }

        .admin-container {
            display: none;
            max-width: 1100px;
            margin: 20px auto;
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-line);
        }

        .header-title h2 {
            color: var(--gold-accent);
            font-size: 1.8rem;
        }

        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-line);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 35px;
        }

        .form-card h3 {
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .form-group input {
            padding: 10px 14px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--gold-accent);
        }

        .btn-submit {
            grid-column: 1 / -1;
            padding: 12px;
            background: linear-gradient(135deg, #e5be6f 0%, #c49a45 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 190, 111, 0.3);
        }

        .students-table-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-line);
            border-radius: 18px;
            padding: 25px;
            overflow-x: auto;
        }

        .table-admin {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .table-admin th, .table-admin td {
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .table-admin th {
            color: var(--text-sub);
            font-size: 0.88rem;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <i class="fas fa-lock"></i>
            <h3>لوحة تحكم مس عفاف</h3>
            <p style="color: var(--text-sub); font-size: 0.85rem;">يرجى إدخال كلمة السر للمتابعة</p>
            <input type="password" id="adminPassword" placeholder="كلمة السر">
            <button onclick="checkPassword()">دخول</button>
        </div>
    </div>

    <div class="admin-container" id="adminContainer">
        <div class="header-title">
            <h2><i class="fas fa-user-gear"></i> إدارة درجات الطلاب</h2>
            <span style="color: var(--text-sub); font-size: 0.9rem;">مس عفاف — شارع العلوم</span>
        </div>

        <div class="form-card">
            <h3><i class="fas fa-plus-circle" style="color: var(--gold-accent);"></i> إضافة أو تحديث بيانات طالب</h3>
            <form id="addStudentForm" onsubmit="saveStudent(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>كود الطالب السري *</label>
                        <input type="text" id="stCode" required placeholder="مثال: 101">
                    </div>

                    <div class="form-group">
                        <label>اسم الطالب *</label>
                        <input type="text" id="stName" required placeholder="اسم الطالب الثلاثي">
                    </div>

                    <div class="form-group">
                        <label>الصف الدراسي *</label>
                        <input type="text" id="stLevel" required placeholder="مثال: الصف الرابع الابتدائي">
                    </div>

                    <div class="form-group">
                        <label>الدرجة (من 100) *</label>
                        <input type="number" id="stGrade" min="0" max="100" required placeholder="مثال: 95">
                    </div>

                    <div class="form-group">
                        <label>نسبة الحضور والغياب</label>
                        <input type="text" id="stAttendance" placeholder="مثال: منتظم / 98%">
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>ملاحظات مس عفاف للطالب</label>
                        <input type="text" id="stNotes" placeholder="مثال: ممتاز ومجتهد جداً">
                    </div>

                    <button type="submit" class="btn-submit">حفظ البيانات كـ طالب جديد / تحديث</button>
                </div>
            </form>
        </div>

        <div class="students-table-card">
            <h3 style="margin-bottom: 15px; color: #fff;">قائمة الطلاب المسجلين</h3>
            <table class="table-admin">
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>اسم الطالب</th>
                        <th>الصف</th>
                        <th>الدرجة</th>
                        <th>الغياب</th>
                        <th>الملاحظات</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vloagzhnhfqyadhpxiif.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Oa-X8xiOKzEeEMTBW858ug_iUyO1_yG';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_PASS = '1234';

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                loadStudents();
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        async function loadStudents() {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">جاري تحميل البيانات...</td></tr>';

            const { data, error } = await _supabase
                .from('science_students')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                alert('حدث خطأ في جلب البيانات: ' + error.message);
                return;
            }

            tbody.innerHTML = '';
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا يوجد طلاب مسجلين حتى الآن</td></tr>';
                return;
            }

            data.forEach(st => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:var(--gold-accent); font-weight:bold;">${st.student_code}</td>
                    <td>${st.name}</td>
                    <td>${st.level}</td>
                    <td>${st.grade} / 100</td>
                    <td>${st.attendance || 'منتظم'}</td>
                    <td style="font-size:0.85rem; color:var(--text-sub);">${st.notes || '-'}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteStudent('${st.student_code}')"><i class="fas fa-trash"></i> حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveStudent(e) {
            e.preventDefault();

            const student_code = document.getElementById('stCode').value.trim();
            const name = document.getElementById('stName').value.trim();
            const level = document.getElementById('stLevel').value.trim();
            const grade = parseInt(document.getElementById('stGrade').value);
            const attendance = document.getElementById('stAttendance').value.trim();
            const notes = document.getElementById('stNotes').value.trim();

            const { data, error } = await _supabase
                .from('science_students')
                .upsert([
                    { student_code, name, level, grade, attendance, notes }
                ], { onConflict: 'student_code' });

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } else {
                alert('تم حفظ بيانات الطالب بنجاح!');
                document.getElementById('addStudentForm').reset();
                loadStudents();
            }
        }

        async function deleteStudent(code) {
            if(!confirm(`هل أنت متاكد من حذف الطالب صاحب الكود (${code})؟`)) return;

            const { error } = await _supabase
                .from('science_students')
                .delete()
                .eq('student_code', code);

            if (error) {
                alert('حدث خطأ أثناء الحذف: ' + error.message);
            } else {
                alert('تم حذف الطالب بنجاح');
                loadStudents();
            }
        }
    </script>
</body>
</html>
